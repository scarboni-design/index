<title>Vireo AM LED Final</title>
<style>
:root{
  --bg:#eef0f2;
  --panel:#ffffff;
  --panel-border:#dcdfe3;
  --text:#1b1d20;
  --muted:#666c73;
  --accent:#3f5fa8;
  --mono-chip:#f1f2f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151619;
    --panel:#1e2024;
    --panel-border:#2b2e33;
    --text:#eceef0;
    --muted:#9aa0a7;
    --accent:#7fa0ec;
    --mono-chip:#26282d;
  }
}
:root[data-theme="dark"]{
  --bg:#151619;
  --panel:#1e2024;
  --panel-border:#2b2e33;
  --text:#eceef0;
  --muted:#9aa0a7;
  --accent:#7fa0ec;
  --mono-chip:#26282d;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

.card{
  background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;
  padding:24px 20px 20px; display:flex; flex-direction:column; align-items:center; gap:14px;
  max-width:260px;
}
.tag{
  font-family:"JetBrains Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); align-self:flex-start;
}

.stage{ width:170px; position:relative; display:flex; align-items:flex-start; justify-content:center; }
.device{ position:relative; width:170px; aspect-ratio:553/1269; }
.device > img{ position:absolute; display:block; }
.device > img:first-child{ inset:0; width:100%; height:100%; }

/* LED real, tamanho exato da foto do produto, posição de cima do anel */
.arc{ left:42.13%; top:63.59%; width:17.18%; height:3.0%; }
.arc{ animation:hardBlink 1.8s steps(1,end) infinite; }
@keyframes hardBlink{ 0%,49%{ opacity:0; } 50%,100%{ opacity:1; } }

/* aparelho: dois pulsos de escala ao entrar, depois fica parado (estável) em scale(1) */
.device{
  animation:deviceTwoPulses 3.2s ease-in-out 1;
  animation-fill-mode:forwards;
}
@keyframes deviceTwoPulses{
  0%    { transform:scale(1);     }
  25%   { transform:scale(1.03);  }
  50%   { transform:scale(1);     }
  75%   { transform:scale(1.03);  }
  100%  { transform:scale(1);     }
}

@media (prefers-reduced-motion: reduce){
  .arc{ animation:none !important; opacity:1 !important; }
  .device{ animation:none !important; transform:none !important; }
}

.label{ font-size:14px; font-weight:600; }
.desc{ font-size:12px; line-height:1.55; color:var(--muted); text-align:center; }
.desc code{
  font-family:"JetBrains Mono",ui-monospace,monospace; font-size:11px;
  background:var(--mono-chip); padding:0 4px; border-radius:4px; color:var(--text);
}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<div class="card">
  <span class="tag">Vireo AM · pareamento</span>
  <div class="stage">
    <div class="device">
      <img src="led-off-transparent.png" alt="Vireo AM">
      <img class="arc" src="led-arc-blue.png" alt="">
    </div>
  </div>
  <div class="label">Escala sutil — 2 pulsos</div>
  <div class="desc">
    Ao abrir o modal, o aparelho dá <b>2 pulsos</b> de escala (100%→103%→100%,
    duas vezes) e então fica <b>estável</b>, parado em tamanho normal — só o
    LED azul continua piscando. Atualize a página pra ver o início de novo.
  </div>
</div>
